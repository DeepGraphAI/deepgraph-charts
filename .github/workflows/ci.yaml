name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  lint-and-validate:
    name: Lint and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: Install kubeconform
        run: |
          curl -fsSL \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | tar xz kubeconform
          sudo mv kubeconform /usr/local/bin/

      # Renders every example and feature combination, and asserts that the
      # combinations the chart refuses really are refused.
      - name: Validate
        run: ./scripts/validate.sh

  chart-testing:
    name: chart-testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: helm/chart-testing-action@v2

      - name: Detect changed charts
        id: list-changed
        run: |
          changed=$(ct list-changed --target-branch "${{ github.event.repository.default_branch }}")
          if [ -n "$changed" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Lint
        if: steps.list-changed.outputs.changed == 'true'
        run: ct lint --target-branch "${{ github.event.repository.default_branch }}"

  install-test:
    name: Install on kind
    runs-on: ubuntu-latest
    # Needs a published image to pull; skipped until one is available to CI.
    if: ${{ vars.SYNAPSE_IMAGE != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - uses: helm/kind-action@v1
        with:
          cluster_name: synapse-ci

      - name: Install
        run: |
          kubectl create namespace synapse
          helm install synapse charts/synapse \
            --namespace synapse \
            --set image.repository="${{ vars.SYNAPSE_IMAGE }}" \
            --set image.tag="${{ vars.SYNAPSE_TAG }}" \
            --set auth.password=ci-test-password \
            --set persistence.data.size=5Gi \
            --set resources.requests.cpu=250m \
            --set resources.requests.memory=1Gi \
            --set resources.limits.memory=3Gi \
            --wait --timeout 10m

      - name: Helm test
        run: helm test synapse -n synapse

      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl -n synapse get all
          kubectl -n synapse describe pod synapse-0
          kubectl -n synapse logs synapse-0 --tail=200 || true
