name: Release charts

on:
  push:
    branches: [main]
    paths:
      - "charts/**"
  # Manual re-run, for when a release needs retrying without a chart change
  # (a transient API failure, or re-publishing the index).
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      # Packages any chart whose version changed and publishes it to the
      # gh-pages branch as a Helm repository index. A chart whose version is
      # unchanged is skipped, so bumping Chart.yaml is what triggers a release.
      - uses: helm/chart-releaser-action@v1
        with:
          charts_dir: charts
          # A docs-only or CI-only commit leaves the chart version alone, and
          # re-releasing an existing tag is a 422. Skip rather than fail, so a
          # red workflow always means something actually broke.
          skip_existing: true
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
