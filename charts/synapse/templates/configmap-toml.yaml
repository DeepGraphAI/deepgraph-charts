{{- if not .Values.config.existingConfigMap }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "synapse.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "synapse.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  synapse.toml: |
    {{- if .Values.config.synapseToml }}
    {{- tpl .Values.config.synapseToml . | nindent 4 }}
    {{- else }}
    # Generated by the Synapse Helm chart.
    #
    # Only the tier is pinned here. Every other setting falls back to the
    # server's compiled-in defaults, which is the right starting point for
    # a fresh deployment. Override by setting config.synapseToml.
    #
    # The data directory is NOT set here on purpose: SYNAPSE_DATA_DIR takes
    # precedence over any config file, and the chart sets it from
    # .Values.dataDir so the PVC mount path and the server always agree.
    [tier]
    level = "{{ .Values.tier.level }}"
    {{- end }}
{{- end }}
