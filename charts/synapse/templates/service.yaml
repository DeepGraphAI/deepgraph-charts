apiVersion: v1
kind: Service
metadata:
  name: {{ include "synapse.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "synapse.labels" . | nindent 4 }}
  {{- $ann := include "synapse.annotations" (dict "root" . "specific" .Values.service.annotations) }}
  {{- if $ann }}
  annotations:
    {{- $ann | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  {{- with .Values.service.sessionAffinity }}
  sessionAffinity: {{ . }}
  {{- end }}
  {{- if and (eq .Values.service.type "LoadBalancer") .Values.service.loadBalancerIP }}
  loadBalancerIP: {{ .Values.service.loadBalancerIP }}
  {{- end }}
  {{- if and (eq .Values.service.type "LoadBalancer") .Values.service.loadBalancerSourceRanges }}
  loadBalancerSourceRanges:
    {{- toYaml .Values.service.loadBalancerSourceRanges | nindent 4 }}
  {{- end }}
  {{- if and .Values.service.externalTrafficPolicy (ne (toString .Values.service.type) "ClusterIP") }}
  externalTrafficPolicy: {{ .Values.service.externalTrafficPolicy }}
  {{- end }}
  ports:
    - name: grpc
      port: {{ .Values.server.grpc.port }}
      targetPort: grpc
      protocol: TCP
      {{- if and (has (toString .Values.service.type) (list "NodePort" "LoadBalancer")) .Values.service.nodePorts.grpc }}
      nodePort: {{ .Values.service.nodePorts.grpc }}
      {{- end }}
    {{- if .Values.server.http.enabled }}
    - name: http
      port: {{ .Values.server.http.port }}
      targetPort: http
      protocol: TCP
      {{- if and (has (toString .Values.service.type) (list "NodePort" "LoadBalancer")) .Values.service.nodePorts.http }}
      nodePort: {{ .Values.service.nodePorts.http }}
      {{- end }}
    {{- end }}
    {{- if .Values.server.bolt.enabled }}
    - name: bolt
      port: {{ .Values.server.bolt.port }}
      targetPort: bolt
      protocol: TCP
      {{- if and (has (toString .Values.service.type) (list "NodePort" "LoadBalancer")) .Values.service.nodePorts.bolt }}
      nodePort: {{ .Values.service.nodePorts.bolt }}
      {{- end }}
    {{- end }}
  selector:
    {{- include "synapse.selectorLabels" . | nindent 4 }}
---
# Headless Service. Required by the StatefulSet for stable pod DNS, and in
# cluster mode it is how Raft peers find each other.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "synapse.headlessServiceName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "synapse.labels" . | nindent 4 }}
  {{- $hann := include "synapse.annotations" (dict "root" . "specific" .Values.headlessService.annotations) }}
  {{- if $hann }}
  annotations:
    {{- $hann | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  clusterIP: None
  publishNotReadyAddresses: {{ .Values.headlessService.publishNotReadyAddresses }}
  ports:
    - name: grpc
      port: {{ .Values.server.grpc.port }}
      targetPort: grpc
      protocol: TCP
    {{- if .Values.server.http.enabled }}
    - name: http
      port: {{ .Values.server.http.port }}
      targetPort: http
      protocol: TCP
    {{- end }}
    {{- if .Values.server.bolt.enabled }}
    - name: bolt
      port: {{ .Values.server.bolt.port }}
      targetPort: bolt
      protocol: TCP
    {{- end }}
    {{- if eq (include "synapse.clusterEnabled" .) "true" }}
    - name: raft
      port: {{ .Values.cluster.raftPort }}
      targetPort: raft
      protocol: TCP
    {{- if .Values.cluster.admin.enabled }}
    - name: admin
      port: {{ .Values.cluster.admin.port }}
      targetPort: admin
      protocol: TCP
    {{- end }}
    {{- end }}
  selector:
    {{- include "synapse.selectorLabels" . | nindent 4 }}
